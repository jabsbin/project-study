<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Axios CDN -->
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        window.onload = () => {
            document.querySelector("#btnGet").onclick = loadGogekData;
        }

        async function loadGogekData() {
            const idInput = frm.id.value.trim();
            const pwdInput = frm.pwd.value.trim();
            const showDiv = document.querySelector("#show");

            // 1. ID / PWD 검증 (id: python, pwd: 123)
            if (idInput !== "python" || pwdInput !== "123") {
                alert("ID 또는 비밀번호가 올바르지 않습니다.");
                showDiv.innerHTML = "로그인 실패: ID/PWD를 확인하세요.";
                return;
            }

            showDiv.innerHTML = "데이터를 불러오는 중...";

            try {
                // 2. Axios를 사용하여 gogekdata.json 데이터 읽기
                const response = await axios.get("gogekdata.json");
                const data = response.data;

                if (!Array.isArray(data)) {
                    throw new Error("JSON 데이터가 배열이 아닙니다.");
                }

                // 3. 테이블 출력
                let output = `<table border="1">`;
                output += `<tr><th>고객명</th><th>고객전화</th><th>성별</th></tr>`;

                data.forEach(item => {
                    // 남성이면 노란색(yellow), 여성이면 파란색(blue) 인라인 스타일 적용
                    let color = item.gender === "남" ? "yellow" : "blue";

                    output += `
                        <tr>
                            <td style="color:${color};">${item.name}</td>
                            <td>${item.tel}</td>
                            <td>${item.gender}</td>
                        </tr>
                    `;
                });

                output += `</table>`;
                
                showDiv.innerHTML = output;

            } catch (error) {
                console.error("Axios 에러:", error);
                showDiv.innerHTML = "오류 발생 : " + error.message;
            }
        }
    </script>
</head>
<body>

<h1>문제2)</h1>
직원정보 입력
<form name="frm">
    ID : <input type="text" name="id" value="python"><br>
    PWD : <input type="password" name="pwd" value="123">
    <input type="button" value="관리고객 출력" id="btnGet">
</form>

<hr>

<div id="show"></div>

</body>
</html>
