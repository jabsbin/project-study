<!-- 동기 방식: 서버에 요청을 보낼 때 화면 전체(HTML)를 새로 받아오면서 브라우저가 새로고침(Full Reload)되는 방식
   비동기 방식: 화면 전체를 새로고침하지 않고, 필요한 데이터(JSON, XML 등)만 백그라운드에서 비동기(AJAX, Fetch 등)로 받아와 자바스크립트로 현재 화면의 일부만 동적으로 갱신하는 방식 */
-->
<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <script>
      window.onload = () => {
         document.querySelector("#btnGet").onclick = getFunc;
         document.querySelector("#btnPost").onclick = postFunc;
      }

      let xhr;

      function getFunc(){
         const irum = frm.name.value;
         const nai = frm.age.value;
         // alert(irum + " " + nai);

         // 브라우저에서 웹 서버와 비동기 통신(AJAX)을 위한 객체를 생성
         xhr = new XMLHttpRequest();  // 비동기 처리를 가능하게 함
         let fname = "js18.py?irum=" + irum + "&nai=" + nai;
         xhr.open("GET", fname, true);  // true:비동기, false:동기

         xhr.onreadystatechange = function(){
            // alert(xhr.readyState);
            /*
            if(xhr.readyState === 4){  // 0 ~ 4를 반환하고 4이면 통신 상태 양호
               alert(xhr.status);
            }
            */
            if(xhr.readyState === 4 && xhr.status === 200){
               // 웹서버에 요청이 성공한 상태로 결과를 기다림
               process1();
            }
         }
         xhr.send();
      }

      function process1(){
         // alert("ok");
         document.querySelector("#show").innerText = xhr.responseText;
      }

      function postFunc(){   // 현재 실습 불가 - Live server를 쓰기 때문
         const irum = frm.name.value;
         const nai = frm.age.value;
         
         xhr = new XMLHttpRequest();  // 비동기 처리를 가능하게 함
         let fname = "js18.py"        // 전송시 값 전달할 때 여기서 주지 않음
         xhr.open("POST", fname, true);  // true:비동기, false:동기

         xhr.onreadystatechange = function(){
            if(xhr.readyState === 4 && xhr.status === 200){
               process2();
            }
         }
         xhr.setRequestHeader("content-Type", "application/x-www-form-urlencoded");
         xhr.send("irum=" + irum + "&nai=" + nai);
      }

      function process2(){
         alert(xhr.responseText);
      }
      /*  post와 get방식 차이점 알기 */

   </script>
</head>
<body>
   <h2>Ajax 이해</h2>
   <form name="frm">
      이름 : <input type="text" name="name" value="tom"><br>
      나이 : <input type="text" name="age" value="33"><br>
      <input type="button" value="get방식" id="btnGet">
      <input type="button" value="post방식" id="btnPost">
   </form>
   <hr>
   <div id="show"></div>
</body>
</html>
